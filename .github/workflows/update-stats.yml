name: Update BF signature stats

on:
  schedule:
    - cron: '0 11 * * *'   # daily at 11:00 UTC (~7am Eastern) — adjust as you like
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python Create_png_of_RWGPS_ride_stats.py
        env:
          RWGPS_API_KEY: ${{ secrets.RWGPS_API_KEY }}
          RWGPS_AUTH_TOKEN: ${{ secrets.RWGPS_AUTH_TOKEN }}

      - name: Commit updated PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cycling_stats_sig.png
          git diff --staged --quiet || git commit -m "Update signature stats"
          git push
